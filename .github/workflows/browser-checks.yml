name: Browser checks

on:
  pull_request:
  push:
    branches:
      - main
      - work

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npm run browsers:install

      - name: Start local web server
        run: |
          python3 -m http.server 8765 >/tmp/server.log 2>&1 &
          # Attendre que le serveur reponde (max 15s)
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/index.html >/dev/null; then
              echo "Server ready after ${i} attempts"
              break
            fi
            sleep 0.5
          done

      - name: Run browser screenshots and smoke checks
        run: npm run test:browser

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: styleme-browser-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
